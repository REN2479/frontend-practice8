<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人图书收藏与统计中心</title>
    <!-- Bootstrap 5.3.3 样式（CDN注明版本号） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式放在Bootstrap之后，保证能覆盖默认样式 -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container">
                <a class="navbar-brand" href="#home">图书中心</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu" aria-label="切换导航">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav-menu">
                    <ul class="navbar-nav" id="main-nav">
                        <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
                        <li class="nav-item"><a class="nav-link" href="#books">藏书管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="#stats">使用统计</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- 首页 -->
        <section id="home" class="py-4">
            <h1>个人图书收藏与统计中心</h1>
            <p class="text-muted">整合课堂成果的综合练习：页面、样式、交互、数据与可视化。</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">藏书管理</h5>
                            <p class="card-text">添加、删除图书，按年代筛选，数据保存在浏览器本地。</p>
                            <a href="#books" class="card-link">去管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">使用统计</h5>
                            <p class="card-text">柱状图展示各年代藏书量，数据来自 data/data.json。</p>
                            <a href="#stats" class="card-link">看统计</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">关于本作品</h5>
                            <p class="card-text">《软件开发综合实践》课堂作业八整合练习，作为期末大作业的原型。</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 藏书管理 -->
        <section id="books" class="py-4">
            <h2>藏书管理</h2>
            <form id="book-form" class="row g-2">
                <div class="col-md-4">
                    <label for="name" class="form-label visually-hidden">书名</label>
                    <input type="text" id="name" class="form-control" placeholder="书名" required>
                </div>
                <div class="col-md-4">
                    <label for="author" class="form-label visually-hidden">作者</label>
                    <input type="text" id="author" class="form-control" placeholder="作者" required>
                </div>
                <div class="col-md-2">
                    <label for="year" class="form-label visually-hidden">出版年份</label>
                    <input type="number" id="year" class="form-control" placeholder="出版年份" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">添加图书</button>
                </div>
            </form>
            <p class="tip text-danger" id="tip"></p>
            <div class="row my-2">
                <div class="col-md-4">
                    <label for="filter" class="form-label visually-hidden">年代筛选</label>
                    <select id="filter" class="form-select">
                        <option value="all">全部年代</option>
                        <option value="2000">2000年后</option>
                        <option value="1990">1990年代</option>
                        <option value="old">1980年代及以前</option>
                    </select>
                </div>
            </div>
            <div id="book-list"></div>
        </section>

        <!-- 使用统计 -->
        <section id="stats" class="py-4">
            <h2>使用统计</h2>
            <p class="text-danger" id="chart-tip"></p>
            <!-- 图表容器必须定高，否则init后高度为0画不出图 -->
            <div id="chart" style="height: 360px;"></div>
            <p class="text-muted small">数据来源：data/data.json（手工整理的示例藏书数据）</p>
        </section>
    </main>

    <footer class="bg-light py-3 text-center text-muted small">
        个人图书收藏与统计中心 | 课堂作业八整合练习 | 2026秋季学期
    </footer>

    <!-- 库在前，自己的代码在后 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
