<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你版校园信息中心</title>
    <!-- Bootstrap 5.3.3 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式放Bootstrap之后 -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container">
                <a class="navbar-brand" href="#home">校园信息中心</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu" aria-label="切换导航">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav-menu">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
                        <li class="nav-item"><a class="nav-link" href="#rooms">自习室</a></li>
                        <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
                        <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- 首页卡片 -->
        <section id="home" class="py-4">
            <h1>迷你版校园信息中心</h1>
            <p class="text-muted">课堂案例复现：页面结构、交互、可视化与三维展示的整合骨架。</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">自习室查询</h5>
                            <p class="card-text">按楼层筛选各自习室的开放状态与座位数。</p>
                            <a href="#rooms" class="card-link">去查询</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">使用统计</h5>
                            <p class="card-text">柱状图展示各自习室本周使用时长。</p>
                            <a href="#stats" class="card-link">看统计</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">校园三维导览</h5>
                            <p class="card-text">用 A-Frame 搭建的校园地标三维场景。</p>
                            <a href="three-d/scene.html" class="card-link">进入导览</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 自习室查询 -->
        <section id="rooms" class="py-4">
            <h2>自习室查询</h2>
            <div class="row my-2">
                <div class="col-md-4">
                    <label for="floor-filter" class="form-label visually-hidden">楼层筛选</label>
                    <select id="floor-filter" class="form-select">
                        <option value="all">全部楼层</option>
                        <option value="1">一楼</option>
                        <option value="2">二楼</option>
                        <option value="3">三楼</option>
                    </select>
                </div>
            </div>
            <p class="text-danger" id="room-tip"></p>
            <div id="room-list"></div>
        </section>

        <!-- 使用统计 -->
        <section id="stats" class="py-4">
            <h2>使用统计</h2>
            <p class="text-danger" id="chart-tip"></p>
            <!-- 容器定高，避免init后高度为0 -->
            <div id="chart" style="height: 360px;"></div>
            <p class="text-muted small">数据来源：data/data.json（教师下发的示例数据格式，数值为演示用）</p>
        </section>
    </main>

    <footer class="bg-light py-3 text-center text-muted small">
        迷你版校园信息中心 | 课堂案例复现 | 2026秋季学期
    </footer>

    <!-- 库在前，自己的代码在后 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
